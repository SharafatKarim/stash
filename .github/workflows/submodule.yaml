name: GH Page -  submodules + push

on:
  push:
    branches:
      - v4    # Restrict to v4 so pushes to other branches don't cause confusion
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. Properly check out repo AND pull submodules in one go
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Node environment
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm i --force

      # 3. Update Quartz and Content
      - name: Update Quartz
        run: npx quartz update
      - name: Sync Quartz
        run: npx quartz sync

      # 4. Commit changes back to repo (with [skip ci] to prevent infinite loops)
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "updated blogs content [skip ci]" --allow-empty)

      # 5. Push changes
      - name: Push changes
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: v4

      # 6. Build Quartz for Pages
      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
